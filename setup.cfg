[metadata]
name = capstone
version = 1.0.0
description = Capstone Project with comprehensive testing and code quality tools
author = khanna-git-02

[nosetests]
verbosity = 2
nocapture = True
with-coverage = True
cover-package = src
cover-branches = True
cover-min-percentage = 80

[coverage:run]
branch = True
source = src
omit =
    */tests/*
    */test_*.py
    */__pycache__/*
    */site-packages/*

[coverage:report]
precision = 2
show_missing = True
skip_covered = False
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:
    @abstractmethod

[flake8]
max-line-length = 100
exclude =
    .git,
    __pycache__,
    build,
    dist,
    .venv,
    venv,
    .eggs,
    *.egg-info,
    .tox,
    .coverage,
    htmlcov
ignore =
    E203,
    E266,
    E501,
    W503
count = True
statistics = True

[pylint]
max-line-length = 100
disable =
    C0111,
    C0103,
    W0212,
    R0913,
    R0914
load-plugins = pylint_django
jobs = 4
